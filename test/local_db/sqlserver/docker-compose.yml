version: '3.8'

services:
  sqlserver:
    image: sqlserver_local:latest
    container_name: sqlserver_custom_container
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SQBoard!Passw0rd
    ports:
      - "1433:1433"
    networks:
      - sqlserver_network
    restart: always

networks:
  sqlserver_network:
    driver: bridge
